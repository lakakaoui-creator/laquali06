<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laquali06</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #333;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3em;
}

.btn{
    display:inline-block;
    padding:12px 25px;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:8px;
    margin-top:10px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    padding:30px;
}

.card{
    width:250px;
    background:#222;
    border-radius:12px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card p{
    padding:10px;
}

.social{
    text-align:center;
    padding:40px;
}

.social a{
    display:inline-block;
    margin:10px;
    color:white;
    text-decoration:none;
    border:1px solid white;
    padding:10px 20px;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
}
</style>
</head>

<body>

<header>
    <h1>LAQUALI06</h1>
    <nav>
        <a href="#">Accueil</a>
        <a href="#">Galerie</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Bienvenue sur Laquali06</h1>
    <p>Site officiel</p>
    <a class="btn" href="#">Découvrir</a>
</section>

<section class="gallery">
    <div class="card">
        <img src="https://picsum.photos/400/300?1">
        <p>Photo 1</p>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/300?2">
        <p>Photo 2</p>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/300?3">
        <p>Photo 3</p>
    </div>
</section>

<section class="social">
    <h2>Mes réseaux</h2>

    <a href="https://instagram.com/">Instagram</a>
    <a href="https://tiktok.com/">TikTok</a>
    <a href="https://snapchat.com/">Snapchat</a>
</section>

<footer>
    © 2026 Laquali06
</footer>

</body>
</html>
